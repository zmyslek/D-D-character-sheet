# Docker's internal DNS resolves "reader" to the IP of every reader replica
# when nginx starts, so the group below contains all of them. nginx sends
# each request to the next server in turn (round-robin).
upstream readers {
    # The shared memory zone gives all nginx worker processes one round-robin
    # position; without it each worker starts at the first server again.
    zone readers 64k;
    server reader:8080 max_fails=1 fail_timeout=10s;
    # Used only when every reader is down.
    server writer:8080 backup;
}

upstream writer {
    zone writer 64k;
    server writer:8080;
}

# Reads may go to any instance; changes must go to the single writer.
map $request_method $pool {
    GET     readers;
    HEAD    readers;
    default writer;
}

server {
    listen 80;

    # Health check of the load balancer itself.
    location = /lb-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://$pool;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Passive health check: if an instance fails or times out, retry the
        # request on the next one. nginx never retries POST, so a create is
        # not sent twice (clients retry with an Idempotency-Key instead).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        add_header X-Upstream $upstream_addr always;
    }
}
