{{define "create.html"}}
<!-- Collects the fields submitted to the character creation handler. -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create character · Party Ledger</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="shell narrow"><nav><a href="/">← All characters</a></nav><header><p class="eyebrow">New adventurer</p><h1>Build a character</h1></header><form class="create-form" method="post"><label>Name<input name="name" required></label><div class="form-row"><label>Race<input name="race" placeholder="Human" required></label><label>Class<input name="class" placeholder="Wizard" required></label></div><div class="form-row"><label>Background<input name="background" value="Acolyte"></label><label>Level<input name="level" type="number" min="1" max="20" value="1" required></label></div><h2>Ability scores</h2><div class="score-fields">{{range $field := (slice "str" "dex" "con" "int" "wis" "cha")}}<label>{{upper $field}}<input name="{{$field}}" type="number" value="10" required></label>{{end}}</div><button class="button" type="submit">Create character</button></form></main></body></html>
{{end}}
