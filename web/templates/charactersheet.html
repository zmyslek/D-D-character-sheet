<!DOCTYPE html>
<!-- Legacy standalone character-sheet layout from the original assignment. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/normalize.css">
    <link rel="stylesheet" href="/style.css">
    <title>{{if .Editing}}Edit {{.Name}}{{else if .Name}}{{.Name}} · Character Sheet{{else}}Create Character{{end}}</title>
</head>
<body>
    <!-- The sheet form hosts editable character fields and the calculated reference boxes. -->
    <form class="charsheet">
  <!-- Identity fields describe who the character is and their class level. -->
  <header>
    <section class="charname">
      <label for="charname">Character Name</label><input name="charname" id="charname" placeholder="Xaden Riorson" {{if .Editing}}readonly{{end}} />
    </section>
    <section class="misc">
      <ul>
        <li>
          <label for="classlevel">Class & Level</label><input name="classlevel" id="classlevel" placeholder="Warlock 10" />
        </li>
        <li>
          <label for="background">Background</label><input name="background" id="background" placeholder="Soldier" />
        </li>
        <li>
          <label for="playername">Player Name</label><input name="playername" id="playername" placeholder="Player McPlayerface">
        </li>
        <li>
          <label for="race">Race</label><input name="race" id="race" placeholder="Human" />
        </li>
        <li>
          <label for="alignment">Alignment</label><input name="alignment" id="alignment" placeholder="Lawful Good" />
        </li>
        <li>
          <label for="experiencepoints">Experience Points</label><input name="experiencepoints" id="experiencepoints" placeholder="3240" />
        </li>
      </ul>
    </section>
  </header>
  <!-- Ability scores, proficiencies, combat statistics, and equipment fill the sheet body. -->
  <main>
    <section>
      <section class="attributes">
        <div class="scores">
          <ul>
            <li>
              <div class="score">
                <label for="Strengthscore">Strength</label><input name="Strengthscore" id="Strengthscore" placeholder="14" class="stat"/>
              </div>
              <div class="modifier">
                <input name="Strengthmod" id="Strengthmod" aria-label="Strengthmod" placeholder="+2" class="statmod"/>
              </div>
            </li>
            <li>
              <div class="score">
                <label for="Dexterityscore">Dexterity</label><input name="Dexterityscore" id="Dexterityscore" placeholder="18" class="stat"/>
              </div>
              <div class="modifier">
                <input name="Dexteritymod" id="Dexteritymod" aria-label="Dexteritymod" placeholder="+4" class=statmod/>
              </div>
            </li>
            <li>
              <div class="score">
                <label for="Constitutionscore">Constitution</label><input name="Constitutionscore" id="Constitutionscore" placeholder="16" class="stat"/>
              </div>
              <div class="modifier">
                <input name="Constitutionmod" id="Constitutionmod" aria-label="Constitutionmod" placeholder="+3" class="statmod"/>
              </div>
            </li>
            <li>
              <div class="score">
                <label for="Wisdomscore">Wisdom</label><input name="Wisdomscore" id="Wisdomscore" placeholder="13" class="stat"/>
              </div>
              <div class="modifier">
                <input name="Wisdommod" id="Wisdommod" aria-label="Wisdommod" placeholder="+1" />
              </div>
            </li>
            <li>
              <div class="score">
                <label for="Intelligencescore">Intelligence</label><input name="Intelligencescore" id="Intelligencescore" placeholder="12" class="stat"/>
              </div>
              <div class="modifier">
                <input name="Intelligencemod" id="Intelligencemod" aria-label="Intelligencemod" placeholder="+1" class="statmod"/>
              </div>
            </li>
            <li>
              <div class="score">
                <label for="Charismascore">Charisma</label><input name="Charismascore" id="Charismascore" placeholder="20" class="stat"/>
              </div>
              <div class="modifier">
                <input name="Charismamod" id="Charismamod" aria-label="Charismamod" placeholder="+5" class="statmod"/>
              </div>
            </li>
          </ul>
        </div>
        <div class="attr-applications">
          <div class="inspiration box">
            <div class="label-container">
              <label for="inspiration">Inspiration</label>
            </div>
            <input name="inspiration" id="inspiration" type="checkbox" />
          </div>
          <div class="proficiencybonus box">
            <div class="label-container">
              <label for="proficiencybonus">Proficiency Bonus</label>
            </div>
            <input name="proficiencybonus" id="proficiencybonus" placeholder="+4" />
          </div>
          <div class="saves list-section box">
            <ul>
              <li>
                <label for="Strength-save">Strength</label><input name="Strength-save" id="Strength-save" placeholder="+0" type="text" /><input name="Strength-save-prof" id="Strength-save-prof" aria-label="Strength save proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Dexterity-save">Dexterity</label><input name="Dexterity-save" id="Dexterity-save" placeholder="+0" type="text" /><input name="Dexterity-save-prof" id="Dexterity-save-prof" aria-label="Dexterity save proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Constitution-save">Constitution</label><input name="Constitution-save" id="Constitution-save" placeholder="+0" type="text" /><input name="Constitution-save-prof" id="Constitution-save-prof" aria-label="Constitution save proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Wisdom-save">Wisdom</label><input name="Wisdom-save" id="Wisdom-save" placeholder="+0" type="text" /><input name="Wisdom-save-prof" id="Wisdom-save-prof" aria-label="Wisdom save proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Intelligence-save">Intelligence</label><input name="Intelligence-save" id="Intelligence-save" placeholder="+0" type="text" /><input name="Intelligence-save-prof" id="Intelligence-save-prof" aria-label="Intelligence save proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Charisma-save">Charisma</label><input name="Charisma-save" id="Charisma-save" placeholder="+0" type="text" /><input name="Charisma-save-prof" id="Charisma-save-prof" aria-label="Charisma save proficiency" type="checkbox" />
              </li>
            </ul>
            <div class="label">
              Saving Throws
            </div>
          </div>
          <div class="skills list-section box">
            <ul>
              <li>
                <label for="Acrobatics">Acrobatics <span class="skill">(Dex)</span></label><input name="Acrobatics" id="Acrobatics" placeholder="+0" type="text" /><input name="Acrobatics-prof" id="Acrobatics-prof" aria-label="Acrobatics proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Animal Handling">Animal Handling <span class="skill">(Wis)</span></label><input name="Animal Handling" id="Animal Handling" placeholder="+0" type="text" /><input name="Animal Handling-prof" id="Animal Handling-prof" aria-label="Animal Handling proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Arcana">Arcana <span class="skill">(Int)</span></label><input name="Arcana" id="Arcana" placeholder="+0" type="text" /><input name="Arcana-prof" id="Arcana-prof" aria-label="Arcana proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Athletics">Athletics <span class="skill">(Str)</span></label><input name="Athletics" id="Athletics" placeholder="+0" type="text" /><input name="Athletics-prof" id="Athletics-prof" aria-label="Athletics proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Deception">Deception <span class="skill">(Cha)</span></label><input name="Deception" id="Deception" placeholder="+0" type="text" /><input name="Deception-prof" id="Deception-prof" aria-label="Deception proficiency" type="checkbox" />
              </li>
              <li>
                <label for="History">History <span class="skill">(Int)</span></label><input name="History" id="History" placeholder="+0" type="text" /><input name="History-prof" id="History-prof" aria-label="History proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Insight">Insight <span class="skill">(Wis)</span></label><input name="Insight" id="Insight" placeholder="+0" type="text" /><input name="Insight-prof" id="Insight-prof" aria-label="Insight proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Intimidation">Intimidation <span class="skill">(Cha)</span></label><input name="Intimidation" id="Intimidation" placeholder="+0" type="text" /><input name="Intimidation-prof" id="Intimidation-prof" aria-label="Intimidation proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Investigation">Investigation <span class="skill">(Int)</span></label><input name="Investigation" id="Investigation" placeholder="+0" type="text" /><input name="Investigation-prof" id="Investigation-prof" aria-label="Investigation proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Medicine">Medicine <span class="skill">(Wis)</span></label><input name="Medicine" id="Medicine" placeholder="+0" type="text" /><input name="Medicine-prof" id="Medicine-prof" aria-label="Medicine proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Nature">Nature <span class="skill">(Int)</span></label><input name="Nature" id="Nature" placeholder="+0" type="text" /><input name="Nature-prof" id="Nature-prof" aria-label="Nature proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Perception">Perception <span class="skill">(Wis)</span></label><input name="Perception" id="Perception" placeholder="+0" type="text" /><input name="Perception-prof" id="Perception-prof" aria-label="Perception proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Performance">Performance <span class="skill">(Cha)</span></label><input name="Performance" id="Performance" placeholder="+0" type="text" /><input name="Performance-prof" id="Performance-prof" aria-label="Performance proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Persuasion">Persuasion <span class="skill">(Cha)</span></label><input name="Persuasion" id="Persuasion" placeholder="+0" type="text" /><input name="Persuasion-prof" id="Persuasion-prof" aria-label="Persuasion proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Religion">Religion <span class="skill">(Int)</span></label><input name="Religion" id="Religion" placeholder="+0" type="text" /><input name="Religion-prof" id="Religion-prof" aria-label="Religion proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Sleight of Hand">Sleight of Hand <span class="skill">(Dex)</span></label><input name="Sleight of Hand" id="Sleight of Hand" placeholder="+0" type="text" /><input name="Sleight of Hand-prof" id="Sleight of Hand-prof" aria-label="Sleight of Hand proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Stealth">Stealth <span class="skill">(Dex)</span></label><input name="Stealth" id="Stealth" placeholder="+0" type="text" /><input name="Stealth-prof" id="Stealth-prof" aria-label="Stealth proficiency" type="checkbox" />
              </li>
              <li>
                <label for="Survival">Survival <span class="skill">(Wis)</span></label><input name="Survival" id="Survival" placeholder="+0" type="text" /><input name="Survival-prof" id="Survival-prof" aria-label="Survival proficiency" type="checkbox" />
              </li>
            </ul>
            <div class="label">
              Skills
            </div>
          </div>
        </div>
      </section>
      <div class="passive-perception box">
        <div class="label-container">
          <label for="passiveperception">Passive Wisdom (Perception)</label>
        </div>
          <input name="passiveperception" id="passiveperception" placeholder="11" />
      </div>
      <div class="otherprofs box textblock">
        <label for="otherprofs">Other Proficiencies and Languages</label><textarea name="otherprofs" id="otherprofs"></textarea>
      </div>
    </section>
    <section>
      <section class="combat">
        <div class="armorclass">
          <div>
            <label for="ac">Armor Class</label><input name="ac" id="ac" placeholder="16" type="text" />
          </div>
        </div>
        <div class="initiative">
          <div>
            <label for="initiative">Initiative</label><input name="initiative" id="initiative" placeholder="+4" type="text" />
          </div>
        </div>
        <div class="speed">
          <div>
            <label for="speed">Speed</label><input name="speed" id="speed" placeholder="30" type="text" />
          </div>
        </div>
        <div class="hp">
          <div class="regular">
            <div class="max">
              <label for="maxhp">Hit Point Maximum</label><input name="maxhp" id="maxhp" placeholder="10" type="text" />
            </div>
            <div class="current">
              <label for="currenthp">Current Hit Points</label><input name="currenthp" id="currenthp" type="text" />
            </div>
          </div>
          <div class="temporary">
            <label for="temphp">Temporary Hit Points</label><input name="temphp" id="temphp" type="text" />
          </div>
        </div>
        <div class="hitdice">
          <div>
            <div class="total">
              <label for="totalhd">Total</label><input name="totalhd" id="totalhd" placeholder="2d10" type="text" />
            </div>
            <div class="remaining">
              <label for="remaininghd">Hit Dice</label><input name="remaininghd" id="remaininghd" type="text" />
            </div>
          </div>
        </div>
        <div class="deathsaves">
          <div>
            <div class="label">
              <label>Death Saves</label>
            </div>
            <div class="marks">
              <div class="deathsuccesses">
                <label>Successes</label>
                <div class="bubbles">
                  <input name="deathsuccess1" id="deathsuccess1" aria-label="deathsuccess1" type="checkbox" />
                  <input name="deathsuccess2" id="deathsuccess2" aria-label="deathsuccess2" type="checkbox" />
                  <input name="deathsuccess3" id="deathsuccess3" aria-label="deathsuccess3" type="checkbox" />
                </div>
              </div>
              <div class="deathfails">
                <label>Failures</label>
                <div class="bubbles">
                  <input name="deathfail1" id="deathfail1" aria-label="deathfail1" type="checkbox" />
                  <input name="deathfail2" id="deathfail2" aria-label="deathfail2" type="checkbox" />
                  <input name="deathfail3" id="deathfail3" aria-label="deathfail3" type="checkbox" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section class="attacksandspellcasting">
        <div>
          <label>Attacks & Spellcasting</label>
          <table>
            <thead>
              <tr>
                <th>
                  Name
                </th>
                <th>
                  Atk Bonus
                </th>
                <th>
                  Damage/Type
                </th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>
                  <input name="atkname1" id="atkname1" aria-label="atkname1" placeholder="Longsword" type="text" />
                </td>
                <td>
                  <input name="atkbonus1" id="atkbonus1" aria-label="atkbonus1" type="text" />
                </td>
                <td>
                  <input name="atkdamage1" id="atkdamage1" aria-label="atkdamage1" type="text" />
                </td>
              </tr>
              <tr>
                <td>
                  <input name="atkname2" id="atkname2" aria-label="atkname2" placeholder="Optional off-hand weapon" type="text" />
                </td>
                <td>
                  <input name="atkbonus2" id="atkbonus2" aria-label="atkbonus2" type="text" />
                </td>
                <td>
                  <input name="atkdamage2" id="atkdamage2" aria-label="atkdamage2" type="text" />
                </td>
              </tr>
              <tr>
                <td>
                  <input name="atkname3" id="atkname3" aria-label="atkname3" placeholder="Eldritch Blast" type="text" />
                </td>
                <td>
                  <input name="atkbonus3" id="atkbonus3" aria-label="atkbonus3" type="text" />
                </td>
                <td>
                  <input name="atkdamage3" id="atkdamage3" aria-label="atkdamage3" type="text" />
                </td>
              </tr>
            </tbody>
          </table>
          <textarea name="spellcasting" id="spellcasting" aria-label="spellcasting" placeholder="Known spells: eldritch blast, darkness, shadow blade, misty step"></textarea>
        </div>
      </section>
      <section class="equipment">
        <div>
          <label>Equipment</label>
          <div class="money">
            <ul>
              <li>
                <label for="cp">cp</label><input name="cp" id="cp" />
              </li>
              <li>
                <label for="sp">sp</label><input name="sp" id="sp" />
              </li>
              <li>
                <label for="ep">ep</label><input name="ep" id="ep" />
              </li>
              <li>
                <label for="gp">gp</label><input name="gp" id="gp" />
              </li>
              <li>
                <label for="pp">pp</label><input name="pp" id="pp" />
              </li>
            </ul>
          </div>
          <textarea name="equipment" id="equipment" aria-label="equipment" placeholder="Armor: Studded Leather Armor&#10;Weapon: Longsword"></textarea>
        </div>
      </section>
    </section>
    <section>
      <section class="flavor">
        <div class="personality">
          <label for="personality">Personality</label><textarea name="personality" id="personality"></textarea>
        </div>
        <div class="ideals">
          <label for="ideals">Ideals</label><textarea name="ideals" id="ideals"></textarea>
        </div>
        <div class="bonds">
          <label for="bonds">Bonds</label><textarea name="bonds" id="bonds"></textarea>
        </div>
        <div class="flaws">
          <label for="flaws">Flaws</label><textarea name="flaws" id="flaws"></textarea>
        </div>
      </section>
      <section class="features">
        <div>
          <label for="features">Features & Traits</label><textarea name="features" id="features"></textarea>
        </div>
      </section>
    </section>
</main>
  <div class="sheet-actions">
    <a class="back-button" href="/">← Back to characters</a>
    {{if .Editing}}<a href="/characters/{{pathEscape .Name}}">Cancel editing</a>{{else if .Name}}<a href="/characters/{{pathEscape .Name}}/edit">Edit character</a>{{end}}
    <button type="button" id="save-character">{{if .Editing}}Save changes{{else}}Save character{{end}}</button>
    <output id="save-status" aria-live="polite"></output>
  </div>
</form>
  <script id="character-data" type="application/json">{{json .}}</script>
<script>
  const serverCharacterElement = document.getElementById('character-data');
  let serverCharacter = null;
  try {
    if (serverCharacterElement?.textContent.trim()) {
      serverCharacter = JSON.parse(serverCharacterElement.textContent);
    }
  } catch (_) {
    serverCharacter = null;
  }
  const character = serverCharacter || window.characterData || {
  Name: '', Race: '', Class: '', Level: 1, Background: '', SkillProficiencies: [],
  MainHand: '', OffHand: '', Armor: '', Shield: '', KnownSpells: [], PreparedSpells: [],
  Str: 10, Dex: 10, Con: 10, Int: 10, Wis: 10, Cha: 10
};
// Keep a local draft only while creating a character, so a refresh does not
// lose the form. A saved character is always shown exactly as the server
// stored it: a draft must never show spells or items the rules rejected.
const usesDraft = !serverCharacter?.Name;
const storageKey = 'mpp-character-draft';
let hasSavedCharacter = Boolean(serverCharacter);
if (usesDraft) {
  try {
    const savedCharacter = JSON.parse(localStorage.getItem(storageKey));
    if (savedCharacter) {
      // The rules table always comes from the server, never from a draft.
      delete savedCharacter.SpellcastingByClass;
      Object.assign(character, savedCharacter);
      hasSavedCharacter = true;
    }
  } catch (_) {
    // Ignore unavailable or malformed browser storage.
  }
}
// Map the sheet's display labels to the persisted ability-score property names.
const abilityFields = {
  Strength: 'Str',
  Dexterity: 'Dex',
  Constitution: 'Con',
  Wisdom: 'Wis',
  Intelligence: 'Int',
  Charisma: 'Cha'
};
// Each skill uses one ability modifier when the sheet recalculates its bonus.
const skillAbilities = {
  Acrobatics: 'Dex',
  'Animal Handling': 'Wis',
  Arcana: 'Int',
  Athletics: 'Str',
  Deception: 'Cha',
  History: 'Int',
  Insight: 'Wis',
  Intimidation: 'Cha',
  Investigation: 'Int',
  Medicine: 'Wis',
  Nature: 'Int',
  Perception: 'Wis',
  Performance: 'Cha',
  Persuasion: 'Cha',
  Religion: 'Int',
  'Sleight of Hand': 'Dex',
  Stealth: 'Dex',
  Survival: 'Wis'
};
// Seed the visible form fields from the server record and its derived statistics.
const fields = {
  charname: character.Name,
  classlevel: `${character.Class} ${character.Level}`,
  background: character.Background,
  race: character.Race,
  Strengthscore: character.Str,
  Strengthmod: character.StrengthModifier,
  Dexterityscore: character.Dex,
  Dexteritymod: character.DexterityModifier,
  Constitutionscore: character.Con,
  Constitutionmod: character.ConstitutionModifier,
  Wisdomscore: character.Wis,
  Wisdommod: character.WisdomModifier,
  Intelligencescore: character.Int,
  Intelligencemod: character.IntelligenceModifier,
  Charismascore: character.Cha,
  Charismamod: character.CharismaModifier,
  proficiencybonus: `+${character.ProficiencyBonus}`,
  passiveperception: character.PassiveWisdom,
  ac: character.ArmorClass,
  initiative: character.Initiative >= 0 ? `+${character.Initiative}` : character.Initiative,
  otherprofs: (character.SkillProficiencies || []).join(', '),
  atkname1: character.MainHand,
  atkname2: character.OffHand,
  equipment: [
    character.Armor ? `Armor: ${character.Armor}` : '',
    character.Shield ? `Shield: ${character.Shield}` : '',
    character.MainHand ? `Weapon: ${character.MainHand}` : '',
    character.OffHand ? `Off-hand: ${character.OffHand}` : ''
  ].filter(Boolean).join('\n'),
  spellcasting: [
    character.KnownSpells?.length ? `Known spells: ${character.KnownSpells.join(', ')}` : '',
    character.PreparedSpells?.length ? `Prepared spells: ${character.PreparedSpells.join(', ')}` : ''
  ].filter(Boolean).join('\n')
};
// Find a form control by its submitted field name.
const input = name => document.querySelector(`[name="${name}"]`);
// Write a derived or loaded value into a field when that field exists on the sheet.
const setField = (name, value) => {
  const element = input(name);
  if (element && value !== undefined && value !== '') element.value = value;
};
// Cache API lookups and rendered detail text to avoid repeat requests while editing.
const enrichmentCache = new Map();
// Normalize stored comma-separated values and arrays into a displayable string list.
const listValue = value => Array.isArray(value)
  ? value.map(item => String(item).trim()).filter(Boolean)
  : String(value || '').split(',').map(item => item.trim()).filter(Boolean);
// Convert one ability score into its D&D modifier using floor division.
const modifier = score => Math.floor((Number(score) - 10) / 2);
// Display a modifier with the sign expected on a character sheet.
const formatModifier = value => value >= 0 ? `+${value}` : `${value}`;
// Persist the current browser-side model as a recovery draft (creation only).
const saveCharacter = () => {
  if (!usesDraft) return;
  try {
    const { SpellcastingByClass, ...draft } = character;
    localStorage.setItem(storageKey, JSON.stringify(draft));
  } catch (_) {
    // Ignore unavailable browser storage.
  }
};

// Trim a value and normalize it for case-insensitive comparisons.
function normalize(value) {
  return String(value || '').trim().toLowerCase();
}

// Render each recognized equipment entry into the equipment details panel.
function renderEquipment() {
  setField('equipment', [
    character.Armor ? `Armor: ${character.Armor}` : '',
    character.Shield ? `Shield: ${character.Shield}` : '',
    character.MainHand ? `Weapon: ${character.MainHand}` : '',
    character.OffHand ? `Off-hand: ${character.OffHand}` : ''
  ].filter(Boolean).join('\n'));
  setField('atkname1', character.MainHand);
  setField('atkname2', character.OffHand);
}

// Render the known and prepared spell names as separate lists. The field is
// written directly (not with setField) so an empty list clears rejected text.
function renderSpells() {
  const element = input('spellcasting');
  if (!element) return;
  element.value = [
    listValue(character.KnownSpells).length ? `Known spells: ${listValue(character.KnownSpells).join(', ')}` : '',
    listValue(character.PreparedSpells).length ? `Prepared spells: ${listValue(character.PreparedSpells).join(', ')}` : ''
  ].filter(Boolean).join('\n');
}

// Find the output element used to show the external details for one item.
function enrichmentOutput(name) {
  const element = input(name);
  if (!element) return null;
  let output = element.nextElementSibling;
  if (!output || output.dataset.enrichmentFor !== name) {
    output = document.createElement('div');
    output.dataset.enrichmentFor = name;
    output.setAttribute('aria-live', 'polite');
    output.style.cssText = 'font-size:0.8em; line-height:1.3; margin-top:0.25em;';
    element.after(output);
  }
  return output;
}

// Extract unique names from the equipment text box.
function equipmentNames() {
  const names = [];
  for (const line of input('equipment')?.value.split('\n') || []) {
    const match = line.match(/^\s*(armor|shield|weapon|main\s*hand|off\s*-?\s*hand)\s*:\s*(.*?)\s*$/i);
    if (match?.[2]) names.push(match[2]);
  }
  for (const name of ['atkname1', 'atkname2']) {
    const value = input(name)?.value.trim();
    if (value && !names.includes(value)) names.push(value);
  }
  return names;
}

// Extract unique names from both known and prepared spell text.
function spellNames() {
  return [...listValue(character.KnownSpells), ...listValue(character.PreparedSpells)]
    .filter((spell, index, spells) => spells.indexOf(spell) === index);
}

// Select the relevant weapon or armor properties for the details panel.
function formatEquipmentDetails(data) {
  const details = [];
  if (data.equipment_category?.name) details.push(data.equipment_category.name);
  if (data.armor_class?.base !== undefined) {
    details.push(`AC ${data.armor_class.base}${data.armor_class.dex_bonus ? ' + Dex' : ''}`);
  }
  if (data.weapon_range) details.push(`Range: ${data.weapon_range}`);
  if (data.range?.normal !== undefined) details.push(`Normal range: ${data.range.normal} ft.`);
  if (data.two_handed_damage) details.push('Two-handed');
  return details.join(' | ');
}

// Select a spell's school and range fields for the details panel.
function formatSpellDetails(data) {
  const details = [];
  if (data.school?.name) details.push(`School: ${data.school.name}`);
  if (data.range) details.push(`Range: ${data.range}`);
  return details.join(' | ');
}

// Fetch one spell or equipment record through this app's rate-limited API route.
async function enrichResource(resource, name) {
  const key = `${resource}:${normalize(name)}`;
  if (enrichmentCache.has(key)) return enrichmentCache.get(key);
  const request = fetch(`/api/${resource}/${encodeURIComponent(name)}`, {
    headers: { Accept: 'application/json' }
  }).then(async response => {
    if (!response.ok) throw new Error(`API returned ${response.status}`);
    return response.json();
  });
  enrichmentCache.set(key, request);
  try {
    return await request;
  } catch (error) {
    enrichmentCache.delete(key);
    throw error;
  }
}

// Enrich every named spell and item currently shown on the sheet.
async function enrichSheet() {
  const output = enrichmentOutput('equipment');
  const equipmentDetails = [];
  for (const name of equipmentNames()) {
    try {
      const result = await enrichResource('equipment', name);
      const details = formatEquipmentDetails(result.data || {});
      if (details) equipmentDetails.push(`${result.name || name}: ${details}`);
    } catch (_) {
      // Unknown or empty equipment should not prevent other entries from loading.
    }
  }
  if (output) output.textContent = equipmentDetails.join('\n');

  const spellOutput = enrichmentOutput('spellcasting');
  const spellDetails = [];
  for (const name of spellNames()) {
    try {
      const result = await enrichResource('spells', name);
      const details = formatSpellDetails(result.data || {});
      if (details) spellDetails.push(`${result.name || name}: ${details}`);
    } catch (_) {
      // Unknown or empty spells should not prevent other entries from loading.
    }
  }
  if (spellOutput) spellOutput.textContent = spellDetails.join('\n');
}

// Parse the free-form equipment text into armor, shield, and weapon fields.
function readEquipment() {
  const equipment = input('equipment')?.value || '';
  const values = { Armor: '', Shield: '', MainHand: '', OffHand: '' };
  const supplied = { MainHand: false, OffHand: false };
  for (const line of equipment.split('\n')) {
    const match = line.match(/^\s*(armor|shield|weapon|main\s*hand|off\s*-?\s*hand)\s*:\s*(.*?)\s*$/i);
    if (!match) continue;
    const label = match[1].toLowerCase().replace(/\s+/g, '');
    const field = label === 'armor' ? 'Armor'
      : label === 'shield' ? 'Shield'
      : label === 'off-hand' || label === 'offhand' ? 'OffHand'
      : 'MainHand';
    values[field] = match[2];
    if (field === 'MainHand' || field === 'OffHand') supplied[field] = true;
  }
  character.Armor = values.Armor;
  character.Shield = values.Shield;
  character.MainHand = supplied.MainHand ? values.MainHand : input('atkname1')?.value.trim() || '';
  character.OffHand = supplied.OffHand ? values.OffHand : input('atkname2')?.value.trim() || '';
  saveCharacter();
  recalculate();
}

// Parse spell names into the learned and prepared arrays stored with the
// character. Returns false (and restores the last valid spells) when the class
// can't cast spells at this level or uses the other list; the server checks
// the spell list and slot level again when saving.
function readSpells() {
  const { className, level } = classAndLevel();
  const rules = spellcastingAt(className, level);
  const lines = input('spellcasting')?.value.split('\n') || [];
  const spells = { KnownSpells: [], PreparedSpells: [] };
  for (const line of lines) {
    const match = line.match(/^\s*(known|prepared)\s*spells?\s*:\s*(.*)$/i);
    if (!match) continue;
    const field = match[1].toLowerCase() === 'known' ? 'KnownSpells' : 'PreparedSpells';
    spells[field] = listValue(match[2]).map(spell => spell.toLowerCase());
  }
  let problem = '';
  if ((spells.KnownSpells.length || spells.PreparedSpells.length) && !rules.Slots) {
    problem = `${titleCase(className) || 'This character'} can't cast spells at level ${level}.`;
  } else if (spells.PreparedSpells.length && !rules.Prepares) {
    problem = `${titleCase(className)} learns spells: write them as "Known spells: ...".`;
  } else if (spells.KnownSpells.length && rules.Prepares) {
    problem = `${titleCase(className)} prepares spells: write them as "Prepared spells: ...".`;
  }
  const status = document.getElementById('save-status');
  if (problem) {
    if (status) status.textContent = problem;
    renderSpells();
    return false;
  }
  character.KnownSpells = spells.KnownSpells;
  character.PreparedSpells = spells.PreparedSpells;
  saveCharacter();
  recalculate();
  return true;
}

// Calculate the level-based proficiency bonus from the 2014 rules.
function proficiencyBonus(level) {
  return level < 1 ? 0 : 2 + Math.floor((level - 1) / 4);
}

// Calculate armor class using equipped armor, shield, Dexterity, and class features.
function armorClass(scores) {
  const dexterity = modifier(scores.Dex);
  const armor = String(character.Armor || '').trim().toLowerCase();
  let armorClass = 10 + dexterity;
  const limitedDexterity = Math.min(dexterity, 2);
  switch (armor) {
    case 'padded armor':
    case 'leather armor': armorClass = 11 + dexterity; break;
    case 'studded leather armor': armorClass = 12 + dexterity; break;
    case 'hide armor': armorClass = 12 + limitedDexterity; break;
    case 'chain shirt': armorClass = 13 + limitedDexterity; break;
    case 'scale mail':
    case 'breastplate': armorClass = 14 + limitedDexterity; break;
    case 'half plate':
    case 'half plate armor': armorClass = 15 + limitedDexterity; break;
    case 'ring mail': armorClass = 14; break;
    case 'chain mail': armorClass = 16; break;
    case 'splint armor': armorClass = 17; break;
    case 'plate armor': armorClass = 18; break;
    case '':
      if (String(character.Class).toLowerCase() === 'barbarian') armorClass = 10 + dexterity + modifier(scores.Con);
      // Monks lose Unarmored Defense when they carry a shield.
      if (String(character.Class).toLowerCase() === 'monk' && !character.Shield) armorClass = 10 + dexterity + modifier(scores.Wis);
      break;
  }
  return armorClass + (character.Shield ? 2 : 0);
}

// Read the class and level from the "Class & Level" field (for example "Wizard 3").
function classAndLevel() {
  const match = (input('classlevel')?.value || '').trim().match(/^(.*?)\s*(\d+)$/);
  if (!match) return { className: character.Class || '', level: Number(character.Level) || 1 };
  return { className: match[1].trim() || character.Class || '', level: Number(match[2]) };
}

// Look up a class's spellcasting at a level in the table the server built from
// the domain rules. Unknown classes and non-casters get Slots: null.
function spellcastingAt(className, level) {
  const table = character.SpellcastingByClass?.[normalize(className)];
  return table?.[Math.min(Math.max(level, 0), 20)] || { Ability: '', Prepares: false, Slots: null };
}

// Format the spellcasting ability, save DC, and attack bonus; empty for non-casters.
function spellcastingStats(rules, proficiency, scores) {
  const property = { charisma: 'Cha', wisdom: 'Wis', intelligence: 'Int' }[rules.Ability];
  if (!rules.Slots || !property) return '';
  const spellModifier = modifier(scores[property]);
  return `Spellcasting: ${titleCase(rules.Ability)} | Save DC ${8 + proficiency + spellModifier} | Attack ${formatModifier(proficiency + spellModifier)}`;
}

// Format the spell slots, with level 0 shown as the number of cantrips known.
function spellSlotSummary(rules) {
  return Object.entries(rules.Slots || {})
    .sort(([a], [b]) => Number(a) - Number(b))
    .map(([level, count]) => level === '0' ? `Cantrips: ${count}` : `Level ${level}: ${count}`);
}

// Capitalize each word for display.
function titleCase(value) {
  return String(value || '').trim().toLowerCase().replace(/\b\w/g, letter => letter.toUpperCase());
}

if (hasSavedCharacter) {
  for (const [name, value] of Object.entries(fields)) {
    setField(name, value);
  }
}

// Recompute displayed modifiers and derived values whenever level or scores change.
function recalculate() {
  const scores = {};
  for (const [label, property] of Object.entries(abilityFields)) {
    const score = Number(input(`${label}score`)?.value ?? character[property]);
    scores[property] = Number.isFinite(score) ? score : character[property];
    setField(`${label}mod`, formatModifier(modifier(scores[property])));
  }

  const { className, level } = classAndLevel();
  const proficiency = 2 + Math.max(0, Math.floor((level - 1) / 4));
  const proficientIn = skill => (character.SkillProficiencies || []).some(value => value.toLowerCase() === skill.toLowerCase());
  setField('proficiencybonus', formatModifier(proficiency));
  setField('initiative', formatModifier(modifier(scores.Dex)));
  setField('passiveperception', 10 + modifier(scores.Wis) + (proficientIn('Perception') ? proficiency : 0));
  setField('ac', armorClass(scores));

  for (const [ability, property] of Object.entries(abilityFields)) {
    setField(`${ability}-save`, formatModifier(modifier(scores[property])));
  }
  for (const [skill, property] of Object.entries(skillAbilities)) {
    const proficient = proficientIn(skill);
    setField(skill, formatModifier(modifier(scores[property]) + (proficient ? proficiency : 0)));
    // Skill proficiencies come from the class (first N options) and the
    // background when the character is created, so they are not picked here.
    const checkbox = input(`${skill}-prof`);
    if (checkbox) {
      checkbox.checked = proficient;
      checkbox.disabled = true;
    }
  }

  const rules = spellcastingAt(className, level);
  const spellInput = input('spellcasting');
  if (spellInput) {
    spellInput.readOnly = !rules.Slots;
    spellInput.placeholder = !rules.Slots
      ? `${titleCase(className) || 'This class'} can't cast spells at level ${level}`
      : rules.Prepares ? 'Prepared spells: ...' : 'Known spells: ...';
  }
  const features = input('features');
  if (features) {
    features.value = [
      listValue(character.KnownSpells).length ? `Known spells: ${listValue(character.KnownSpells).join(', ')}` : '',
      listValue(character.PreparedSpells).length ? `Prepared spells: ${listValue(character.PreparedSpells).join(', ')}` : '',
      spellcastingStats(rules, proficiency, scores),
      rules.Slots ? `Spell slots: ${spellSlotSummary(rules).join(', ')}` : ''
    ].filter(Boolean).join('\n');
  }
}

for (const label of Object.keys(abilityFields)) {
  input(`${label}score`)?.addEventListener('input', recalculate);
}
input('classlevel')?.addEventListener('input', recalculate);
input('equipment')?.addEventListener('change', readEquipment);
input('atkname1')?.addEventListener('change', readEquipment);
input('atkname2')?.addEventListener('change', readEquipment);
input('spellcasting')?.addEventListener('change', readSpells);
input('equipment')?.addEventListener('change', enrichSheet);
input('atkname1')?.addEventListener('change', enrichSheet);
input('atkname2')?.addEventListener('change', enrichSheet);
input('spellcasting')?.addEventListener('change', enrichSheet);
if (hasSavedCharacter) {
  renderEquipment();
  renderSpells();
  recalculate();
}
enrichSheet();

// Add a quick selector for opening any character returned by the local JSON API.
async function showCharacterBrowser() {
  if (document.getElementById('character-browser')) return;
  const browser = document.createElement('select');
  browser.id = 'character-browser';
  browser.title = 'View a created character';
  browser.innerHTML = '<option value="">View created character...</option>';
  Object.assign(browser.style, {
    position: 'fixed', top: '0.5rem', right: '0.5rem', zIndex: '20',
    maxWidth: 'min(15rem, calc(100vw - 1rem))', padding: '0.35rem',
    background: '#fff', color: '#222', border: '1px solid #777'
  });
  browser.addEventListener('change', () => {
    if (browser.value) window.location.href = `/characters/${encodeURIComponent(browser.value)}`;
  });
  document.body.appendChild(browser);
  try {
    const response = await fetch('/api/characters', { headers: { Accept: 'application/json' } });
    if (!response.ok) throw new Error(`Character request failed: ${response.status}`);
    const characters = await response.json();
    for (const saved of characters) {
      const option = document.createElement('option');
      option.value = saved.Name;
      option.textContent = `${saved.Name} (${saved.Class || 'unknown'})`;
      if (serverCharacter?.Name === saved.Name) option.selected = true;
      browser.appendChild(option);
    }
  } catch (_) {
    browser.remove();
  }
}

showCharacterBrowser();

// Validate the form, update the local record, then create or update it on the server.
document.getElementById('save-character')?.addEventListener('click', async () => {
  const status = document.getElementById('save-status');
  const name = input('charname')?.value.trim() || '';
  const classLevel = input('classlevel')?.value.trim().match(/^(.*?)\s+(\d+)$/);
  if (!name || !input('race')?.value.trim() || !classLevel) {
    if (status) status.textContent = 'Enter a character name, race, and class with level (for example, Wizard 1).';
    return;
  }
  character.Name = name;
  character.Race = input('race').value.trim();
  character.Class = classLevel[1].trim();
  character.Level = Number(classLevel[2]);
  character.Background = input('background')?.value.trim() || '';
  character.Str = Number(input('Strengthscore')?.value || 10);
  character.Dex = Number(input('Dexterityscore')?.value || 10);
  character.Con = Number(input('Constitutionscore')?.value || 10);
  character.Int = Number(input('Intelligencescore')?.value || 10);
  character.Wis = Number(input('Wisdomscore')?.value || 10);
  character.Cha = Number(input('Charismascore')?.value || 10);
  if (!serverCharacter?.Editing) {
    const scores = [character.Str, character.Dex, character.Con, character.Int, character.Wis, character.Cha].sort((a, b) => b - a);
    if (scores.join(',') !== '15,14,13,12,10,8') {
      if (status) status.textContent = 'Assign 15, 14, 13, 12, 10, and 8 once each before saving.';
      return;
    }
  }
  readEquipment();
  if (!readSpells()) return;
  if (status) status.textContent = 'Saving…';
  try {
    const response = await fetch(serverCharacter?.Editing
      ? '/api/characters/' + encodeURIComponent(serverCharacter.Name)
      : '/api/characters', {
      method: serverCharacter?.Editing ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(character)
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || ('Save failed (' + response.status + ')'));
    window.location.assign('/characters/' + encodeURIComponent(character.Name));
  } catch (error) {
    if (status) status.textContent = error.message || 'Could not save character.';
  }
});
</script>
