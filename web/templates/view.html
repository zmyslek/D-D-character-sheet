<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/normalize.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/static/pages.css">
    <title>{{.Name}} – Character Sheet</title>
</head>
<body>
    <!-- The navigation links return to the roster or start character creation. -->
    <nav class="pagenav">
      <a href="/">&larr; All characters</a>
      <a href="/characters/new">+ New character</a>
    </nav>
    <!-- Read-only controls preserve the character-sheet layout without accepting edits. -->
    <form class="charsheet" onsubmit="return false">
  <header>
    <section class="charname">
      <label>Character Name</label><input value="{{.Name}}" readonly />
    </section>
    <section class="misc">
      <ul>
        <li>
          <label>Class &amp; Level</label><input value="{{.ClassLevel}}" readonly />
        </li>
        <li>
          <label>Background</label><input value="{{.BackgroundLabel}}" readonly />
        </li>
        <li>
          <label>Player Name</label><input readonly />
        </li>
        <li>
          <label>Race</label><input value="{{.RaceLabel}}" readonly />
        </li>
        <li>
          <label>Alignment</label><input readonly />
        </li>
        <li>
          <label>Experience Points</label><input readonly />
        </li>
      </ul>
    </section>
  </header>
  <!-- The sheet is read-only and displays ability scores and proficiency calculations. -->
  <main>
    <section>
      <!-- Ability scores, saving throws, and skill bonuses occupy the left column. -->
      <section class="attributes">
        <div class="scores">
          <ul>
            {{range .Abilities}}
            <li>
              <div class="score">
                <label>{{.Name}}</label><input value="{{.Score}}" class="stat" readonly />
              </div>
              <div class="modifier">
                <input value="{{.Mod}}" class="statmod" readonly />
              </div>
            </li>
            {{end}}
          </ul>
        </div>
        <div class="attr-applications">
          <div class="inspiration box">
            <div class="label-container">
              <label>Inspiration</label>
            </div>
            <input type="checkbox" disabled />
          </div>
          <div class="proficiencybonus box">
            <div class="label-container">
              <label>Proficiency Bonus</label>
            </div>
            <input value="{{.ProficiencyText}}" readonly />
          </div>
          <div class="saves list-section box">
            <ul>
              {{range .Saves}}
              <li>
                <label>{{.Name}}</label><input type="text" value="{{.Mod}}" readonly /><input type="checkbox" disabled />
              </li>
              {{end}}
            </ul>
            <div class="label">
              Saving Throws
            </div>
          </div>
          <div class="skills list-section box">
            <ul>
              {{range .Skills}}
              <li>
                <label>{{.Name}} <span class="skill">({{.Ability}})</span></label><input type="text" value="{{.Mod}}" readonly /><input type="checkbox" {{if .Proficient}}checked{{end}} disabled />
              </li>
              {{end}}
            </ul>
            <div class="label">
              Skills
            </div>
          </div>
        </div>
      </section>
      <div class="passive-perception box">
        <div class="label-container">
          <label>Passive Wisdom (Perception)</label>
        </div>
        <input value="{{.PassiveWisdom}}" readonly />
      </div>
      <div class="otherprofs box textblock">
        <label>Skill Proficiencies</label><textarea readonly>{{.OtherProfs}}</textarea>
      </div>
    </section>
    <section>
      <!-- Combat totals use the domain model's armor and Dexterity calculations. -->
      <section class="combat">
        <div class="armorclass">
          <div>
            <label>Armor Class</label><input value="{{.ArmorClass}}" type="text" readonly />
          </div>
        </div>
        <div class="initiative">
          <div>
            <label>Initiative</label><input value="{{.InitiativeText}}" type="text" readonly />
          </div>
        </div>
        <div class="speed">
          <div>
            <label>Speed</label><input type="text" readonly />
          </div>
        </div>
        <div class="hp">
          <div class="regular">
            <div class="max">
              <label>Hit Point Maximum</label><input type="text" readonly />
            </div>
            <div class="current">
              <label>Current Hit Points</label><input type="text" readonly />
            </div>
          </div>
          <div class="temporary">
            <label>Temporary Hit Points</label><input type="text" readonly />
          </div>
        </div>
        <div class="hitdice">
          <div>
            <div class="total">
              <label>Total</label><input type="text" readonly />
            </div>
            <div class="remaining">
              <label>Hit Dice</label><input type="text" readonly />
            </div>
          </div>
        </div>
        <div class="deathsaves">
          <div>
            <div class="label">
              <label>Death Saves</label>
            </div>
            <div class="marks">
              <div class="deathsuccesses">
                <label>Successes</label>
                <div class="bubbles">
                  <input type="checkbox" disabled />
                  <input type="checkbox" disabled />
                  <input type="checkbox" disabled />
                </div>
              </div>
              <div class="deathfails">
                <label>Failures</label>
                <div class="bubbles">
                  <input type="checkbox" disabled />
                  <input type="checkbox" disabled />
                  <input type="checkbox" disabled />
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <!-- Attacks, equipped gear, and spellcasting details are grouped in the center. -->
      <section class="attacksandspellcasting">
        <div>
          <label>Attacks &amp; Spellcasting</label>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Atk Bonus</th>
                <th>Damage/Type</th>
              </tr>
            </thead>
            <tbody>
              {{range .Attacks}}
              <tr>
                <td><input type="text" value="{{.}}" readonly /></td>
                <td><input type="text" readonly /></td>
                <td><input type="text" readonly /></td>
              </tr>
              {{end}}
            </tbody>
          </table>
          <textarea readonly>{{.SpellText}}</textarea>
        </div>
      </section>
      <section class="equipment">
        <div>
          <label>Equipment</label>
          <div class="money">
            <ul>
              <li><label>cp</label><input readonly /></li>
              <li><label>sp</label><input readonly /></li>
              <li><label>ep</label><input readonly /></li>
              <li><label>gp</label><input readonly /></li>
              <li><label>pp</label><input readonly /></li>
            </ul>
          </div>
          <textarea readonly>{{.EquipmentText}}</textarea>
        </div>
      </section>
    </section>
    <section>
      <section class="flavor">
        <div class="personality">
          <label>Personality</label><textarea readonly></textarea>
        </div>
        <div class="ideals">
          <label>Ideals</label><textarea readonly></textarea>
        </div>
        <div class="bonds">
          <label>Bonds</label><textarea readonly></textarea>
        </div>
        <div class="flaws">
          <label>Flaws</label><textarea readonly></textarea>
        </div>
      </section>
      <section class="features">
        <div>
          <label>Features &amp; Traits</label><textarea readonly>{{.FeaturesText}}</textarea>
        </div>
      </section>
    </section>
  </main>
</form>
</body>
</html>
