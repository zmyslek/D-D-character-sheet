{{define "index.html"}}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Party Ledger</title><link rel="stylesheet" href="/static/style.css"></head><body>
<main class="shell"><header class="topbar"><div><p class="eyebrow">SRD 5.1 character archive</p><h1>Party Ledger</h1></div><a class="button" href="/characters/new">Create character</a></header>
<section class="intro"><p>Every adventurer, ready for the next session.</p></section>
<section class="character-grid">{{range .}}<a class="character-card" href="/characters/{{urlquery .Name}}"><span class="card-index">{{.Class}}</span><h2>{{.Name}}</h2><p>{{.Race}} · Level {{.Level}}</p><span class="arrow">View sheet →</span></a>{{else}}<p class="empty">No characters yet. Create the first one.</p>{{end}}</section>
</main></body></html>
{{end}}
