# SonarQube configuration. Override the key and host on the command line, e.g.
#   -Dsonar.projectKey=my-key -Dsonar.host.url=http://localhost:9000
# The token is passed with the SONAR_TOKEN environment variable and is never
# stored in this file.
sonar.projectKey=mpp-zmyslek
sonar.projectName=MPP D&D character sheet
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# Production code: everything except the tests and the HTML/CSS copies that
# were provided with the assignment.
sonar.sources=.
sonar.exclusions=tests/**,**/*_test.go,*.html,*.css,web/static/**,deploy/**,data/**,.cover/**

# All tests live in tests/.
sonar.tests=tests
sonar.test.inclusions=**/*_test.go

# coverage.out: packages tested in-process. coverage-cli.out: main.go and the
# metrics tool, measured while the CLI tests run the built programs.
# See docs/QUALITY_AND_TESTING.md for the commands that create both files.
sonar.go.coverage.reportPaths=coverage.out,coverage-cli.out
