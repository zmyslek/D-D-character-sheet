<!DOCTYPE html>
<!-- Legacy standalone character-sheet layout from the original assignment. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/normalize.css">
    <link rel="stylesheet" href="/style.css">
    <title>{{if .Editing}}Edit {{.Name}}{{else if .Name}}{{.Name}} · Character Sheet{{else}}Create Character{{end}}</title>
</head>
<body>
    <!-- The sheet form holds editable fields plus read-only calculated rule values. -->
    <form class="charsheet">
  <!-- Identity fields identify the character and their selected class level. -->
  <header>
    <section class="charname">
      <label for="charname">Character Name</label><input name="charname" placeholder="Xaden Riorson" {{if .Editing}}readonly{{end}} />
    </section>
    <section class="misc">
      <ul>
        <li>
          <label for="classlevel">Class & Level</label><input name="classlevel" placeholder="Warlock 10" />
        </li>
        <li>
          <label for="background">Background</label><input name="background" placeholder="Soldier" />
        </li>
        <li>
          <label for="playername">Player Name</label><input name="playername" placeholder="Player McPlayerface">
        </li>
        <li>
          <label for="race">Race</label><input name="race" placeholder="Human" />
        </li>
        <li>
          <label for="alignment">Alignment</label><input name="alignment" placeholder="Lawful Good" />
        </li>
        <li>
          <label for="experiencepoints">Experience Points</label><input name="experiencepoints" placeholder="3240" />
        </li>
      </ul>
    </section>
  </header>
  <!-- The body is organized into ability, combat, equipment, and notes columns. -->

    <section>
      <section class="attributes">
        <div class="scores">

              </div>

                <input name="Dexteritymod" placeholder="+4" class=statmod/>
              </div>
            </li>
            <li>
              <div class="score">
                <label for="Constitutionscore">Constitution</label><input name="Constitutionscore" placeholder="16" class="stat"/>
              </div>
              <div class="modifier">
                <input name="Constitutionmod" placeholder="+3" class="statmod"/>
              </div>
            </li>
            <li>
              <div class="score">
                <label for="Wisdomscore">Wisdom</label><input name="Wisdomscore" placeholder="13" class="stat"/>
              </div>
              <div class="modifier">
                <input name="Wisdommod" placeholder="+1" />
              </div>
            </li>
            <li>
              <div class="score">
                <label for="Intelligencescore">Intelligence</label><input name="Intelligencescore" placeholder="12" class="stat"/>
              </div>
              <div class="modifier">
                <input name="Intelligencemod" placeholder="+1" class="statmod"/>
              </div>
            </li>
            <li>
              <div class="score">
                <label for="Charismascore">Charisma</label><input name="Charismascore" placeholder="20" class="stat"/>
              </div>
              <div class="modifier">
                <input name="Charismamod" placeholder="+5" class="statmod"/>
              </div>
            </li>
          </ul>
        </div>
        <div class="attr-applications">
          <div class="inspiration box">
            <div class="label-container">
              <label for="inspiration">Inspiration</label>
            </div>
            <input name="inspiration" type="checkbox" />
          </div>
          <div class="proficiencybonus box">
            <div class="label-container">
              <label for="proficiencybonus">Proficiency Bonus</label>
            </div>
            <input name="proficiencybonus" placeholder="+4" />
          </div>
          <div class="saves list-section box">
            <ul>

              </li>

              </li>

              </li>
              <li>

              </li>

                <label for="Intelligence-save">Intelligence</label><input name="Intelligence-save" placeholder="+0" type="text" /><input name="Intelligence-save-prof" type="checkbox" />
              </li>

              </li>
            </ul>

          </div>
          <div class="skills list-section box">
            <ul>
              <li>
                <label for="Acrobatics">Acrobatics <span class="skill">(Dex)</span></label><input name="Acrobatics" placeholder="+0" type="text" /><input name="Acrobatics-prof" type="checkbox" />
              </li>

                <label for="Animal Handling">Animal Handling <span class="skill">(Wis)</span></label><input name="Animal Handling" placeholder="+0" type="text" /><input name="Animal Handling-prof" type="checkbox" />
              </li>
              <li>
                <label for="Arcana">Arcana <span class="skill">(Int)</span></label><input name="Arcana" placeholder="+0" type="text" /><input name="Arcana-prof" type="checkbox" />
              </li>
              <li>
                <label for="Athletics">Athletics <span class="skill">(Str)</span></label><input name="Athletics" placeholder="+0" type="text" /><input name="Athletics-prof" type="checkbox" />
              </li>
              <li>
                <label for="Deception">Deception <span class="skill">(Cha)</span></label><input name="Deception" placeholder="+0" type="text" /><input name="Deception-prof" type="checkbox" />
              </li>
              <li>

              </li>

              </li>
              <li>
                <label for="Intimidation">Intimidation <span class="skill">(Cha)</span></label><input name="Intimidation" placeholder="+0" type="text" /><input name="Intimidation-prof" type="checkbox" />
              </li>
              <li>
                <label for="Investigation">Investigation <span class="skill">(Int)</span></label><input name="Investigation" placeholder="+0" type="text" /><input name="Investigation-prof" type="checkbox" />
              </li>
              <li>
                <label for="Medicine">Medicine <span class="skill">(Wis)</span></label><input name="Medicine" placeholder="+0" type="text" /><input name="Medicine-prof" type="checkbox" />
              </li>
              <li>
                <label for="Nature">Nature <span class="skill">(Int)</span></label><input name="Nature" placeholder="+0" type="text" /><input name="Nature-prof" type="checkbox" />
              </li>
              <li>
                <label for="Perception">Perception <span class="skill">(Wis)</span></label><input name="Perception" placeholder="+0" type="text" /><input name="Perception-prof" type="checkbox" />
              </li>
              <li>
                <label for="Performance">Performance <span class="skill">(Cha)</span></label><input name="Performance" placeholder="+0" type="text" /><input name="Performance-prof" type="checkbox" />
              </li>
              <li>
                <label for="Persuasion">Persuasion <span class="skill">(Cha)</span></label><input name="Persuasion" placeholder="+0" type="text" /><input name="Persuasion-prof" type="checkbox" />
              </li>
              <li>
                <label for="Religion">Religion <span class="skill">(Int)</span></label><input name="Religion" placeholder="+0" type="text" /><input name="Religion-prof" type="checkbox" />
              </li>
              <li>
                <label for="Sleight of Hand">Sleight of Hand <span class="skill">(Dex)</span></label><input name="Sleight of Hand" placeholder="+0" type="text" /><input name="Sleight of Hand-prof" type="checkbox" />
              </li>

                <label for="Stealth">Stealth <span class="skill">(Dex)</span></label><input name="Stealth" placeholder="+0" type="text" /><input name="Stealth-prof" type="checkbox" />
              </li>

      </section>
      <div class="passive-perception box">
        <div class="label-container">

        </div>

      </div>
      <div class="otherprofs box textblock">
        <label for="otherprofs">Other Proficiencies and Languages</label><textarea name="otherprofs"></textarea>
      </div>
    </section>
    <section>
      <section class="combat">

          </div>
        </div>
        <div class="initiative">

          </div>
        </div>

            </div>
            <div class="current">

          <div class="temporary">

          </div>
        </div>

          <div>
            <div class="total">

            </div>
            <div class="remaining">
              <label for="remaininghd">Hit Dice</label><input name="remaininghd" type="text" />
            </div>
          </div>
        </div>
        <div class="deathsaves">
          <div>
            <div class="label">
              <label>Death Saves</label>

              <tr>

                </th>

                  Atk Bonus

                  Damage/Type

              <tr>
                <td>
                  <input name="atkname2" placeholder="Optional off-hand weapon" type="text" />
                </td>
                <td>
                  <input name="atkbonus2" type="text" />

                <td>

                </td>

              </tr>

          <textarea name="spellcasting" placeholder="Known spells: eldritch blast, darkness, shadow blade, misty step"></textarea>

      <section class="equipment">

          <label>Equipment</label>

    </section>
    <section>
      <section class="flavor">
        <div class="personality">
          <label for="personality">Personality</label><textarea name="personality"></textarea>
        </div>
        <div class="ideals">
          <label for="ideals">Ideals</label><textarea name="ideals"></textarea>
        </div>
        <div class="bonds">
          <label for="bonds">Bonds</label><textarea name="bonds"></textarea>
        </div>

</main>
  <div class="sheet-actions">

    {{if .Editing}}<a href="/characters/{{pathEscape .Name}}">Cancel editing</a>{{else if .Name}}<a href="/characters/{{pathEscape .Name}}/edit">Edit character</a>{{end}}

    <span id="save-status" role="status" aria-live="polite"></span>

</form>
  <script id="character-data" type="application/json">{{json .}}</script>
<script>
  const serverCharacterElement = document.getElementById('character-data');
  let serverCharacter = null;
  try {
    if (serverCharacterElement?.textContent.trim()) {
      serverCharacter = JSON.parse(serverCharacterElement.textContent);
    }
  } catch (_) {
    serverCharacter = null;
  }
  const character = serverCharacter || window.characterData || {
  Name: '', Race: '', Class: '', Level: 1, Background: '', SkillProficiencies: [],
  MainHand: '', OffHand: '', Armor: '', Shield: '', KnownSpells: [], PreparedSpells: [],
  Str: 10, Dex: 10, Con: 10, Int: 10, Wis: 10, Cha: 10
};
// Use a per-character key so temporary browser drafts do not overwrite each other.
const storageKey = `mpp-character-${character.Name}`;
let hasSavedCharacter = Boolean(serverCharacter);
try {
  const savedCharacter = JSON.parse(localStorage.getItem(storageKey));
  if (savedCharacter) {
    Object.assign(character, savedCharacter);
    hasSavedCharacter = true;
  }
} catch (_) {
  // Ignore unavailable or malformed browser storage.
}
const abilityFields = {
  Strength: 'Str',
  Dexterity: 'Dex',
  Constitution: 'Con',
  Wisdom: 'Wis',
  Intelligence: 'Int',
  Charisma: 'Cha'
};
// Each skill is tied to an ability that supplies its base modifier.
const skillAbilities = {
  Acrobatics: 'Dex',
  'Animal Handling': 'Wis',
  Arcana: 'Int',
  Athletics: 'Str',
  Deception: 'Cha',
  History: 'Int',
  Insight: 'Wis',
  Intimidation: 'Cha',
  Investigation: 'Int',
  Medicine: 'Wis',
  Nature: 'Int',
  Perception: 'Wis',
  Performance: 'Cha',
  Persuasion: 'Cha',
  Religion: 'Int',
  'Sleight of Hand': 'Dex',
  Stealth: 'Dex',
  Survival: 'Wis'
};
// Seed editable inputs and derived boxes from the current character object.
const fields = {
  charname: character.Name,
  classlevel: `${character.Class} ${character.Level}`,
  background: character.Background,
  race: character.Race,
  Strengthscore: character.Str,
  Strengthmod: character.StrengthModifier,
  Dexterityscore: character.Dex,
  Dexteritymod: character.DexterityModifier,
  Constitutionscore: character.Con,
  Constitutionmod: character.ConstitutionModifier,
  Wisdomscore: character.Wis,
  Wisdommod: character.WisdomModifier,
  Intelligencescore: character.Int,
  Intelligencemod: character.IntelligenceModifier,
  Charismascore: character.Cha,
  Charismamod: character.CharismaModifier,
  proficiencybonus: `+${character.ProficiencyBonus}`,
  passiveperception: character.PassiveWisdom,
  ac: character.ArmorClass,
  initiative: character.Initiative >= 0 ? `+${character.Initiative}` : character.Initiative,
  otherprofs: (character.SkillProficiencies || []).join(', '),
  atkname1: character.MainHand,
  atkname2: character.OffHand,
  equipment: [
    character.Armor ? `Armor: ${character.Armor}` : '',
    character.Shield ? `Shield: ${character.Shield}` : '',
    character.MainHand ? `Weapon: ${character.MainHand}` : '',
    character.OffHand ? `Off-hand: ${character.OffHand}` : ''
  ].filter(Boolean).join('\n'),
  spellcasting: [
    character.KnownSpells?.length ? `Known spells: ${character.KnownSpells.join(', ')}` : '',
    character.PreparedSpells?.length ? `Prepared spells: ${character.PreparedSpells.join(', ')}` : ''
  ].filter(Boolean).join('\n')
};
// Locate a sheet control by its form-field name.
const input = name => document.querySelector(`[name="${name}"]`);
// Populate a displayed value only when the sheet has that control.
const setField = (name, value) => {
  const element = input(name);
  if (element && value !== undefined && value !== '') element.value = value;
};
// Reuse completed API responses while the user edits the sheet.
const enrichmentCache = new Map();
// Convert stored arrays or comma-separated text into a normalized list.
const listValue = value => Array.isArray(value)
  ? value.map(item => String(item).trim()).filter(Boolean)
  : String(value || '').split(',').map(item => item.trim()).filter(Boolean);
const characterClass = () => normalize(character.Class);
const modifier = score => Math.floor((Number(score) - 10) / 2);
const formatModifier = value => value >= 0 ? `+${value}` : `${value}`;
const saveCharacter = () => localStorage.setItem(storageKey, JSON.stringify(character));

// Normalize user-entered names for matching against known rules and cache keys.
function normalize(value) {
  return String(value || '').trim().toLowerCase();
}

// Display the details for equipment names that have loaded successfully.
function renderEquipment() {
  setField('equipment', [
    character.Armor ? `Armor: ${character.Armor}` : '',
    character.Shield ? `Shield: ${character.Shield}` : '',
    character.MainHand ? `Weapon: ${character.MainHand}` : '',
    character.OffHand ? `Off-hand: ${character.OffHand}` : ''
  ].filter(Boolean).join('\n'));
  setField('atkname1', character.MainHand);
  setField('atkname2', character.OffHand);
}

// Display spell details in their own section of the sheet.
function renderSpells() {
  setField('spellcasting', [
    listValue(character.KnownSpells).length ? `Known spells: ${listValue(character.KnownSpells).join(', ')}` : '',
    listValue(character.PreparedSpells).length ? `Prepared spells: ${listValue(character.PreparedSpells).join(', ')}` : ''
  ].filter(Boolean).join('\n'));
}

// Locate the detail container associated with an equipment or spell name.
function enrichmentOutput(name) {
  const element = input(name);
  if (!element) return null;
  let output = element.nextElementSibling;
  if (!output || output.dataset.enrichmentFor !== name) {
    output = document.createElement('div');
    output.dataset.enrichmentFor = name;
    output.setAttribute('aria-live', 'polite');
    output.style.cssText = 'font-size:0.8em; line-height:1.3; margin-top:0.25em;';
    element.insertAdjacentElement('afterend', output);
  }
  return output;
}

// Read unique item names from the equipment field.
function equipmentNames() {
  const names = [];
  for (const line of input('equipment')?.value.split('\n') || []) {
    const match = line.match(/^\s*(armor|shield|weapon|main\s*hand|off\s*-?\s*hand)\s*:\s*(.*?)\s*$/i);
    if (match?.[2]) names.push(match[2]);
  }
  for (const name of ['atkname1', 'atkname2']) {
    const value = input(name)?.value.trim();
    if (value && !names.includes(value)) names.push(value);
  }
  return names;
}

// Read unique spell names from the known and prepared spell fields.
function spellNames() {
  return [...listValue(character.KnownSpells), ...listValue(character.PreparedSpells)]
    .filter((spell, index, spells) => spells.indexOf(spell) === index);
}

// Format the equipment properties needed by the sheet for display.
function formatEquipmentDetails(data) {
  const details = [];
  if (data.equipment_category?.name) details.push(data.equipment_category.name);
  if (data.armor_class?.base !== undefined) {
    details.push(`AC ${data.armor_class.base}${data.armor_class.dex_bonus ? ' + Dex' : ''}`);
  }
  if (data.weapon_range) details.push(`Range: ${data.weapon_range}`);
  if (data.range?.normal !== undefined) details.push(`Normal range: ${data.range.normal} ft.`);
  if (data.two_handed_damage) details.push('Two-handed');
  return details.join(' | ');
}

// Format school and range properties from an external spell record.
function formatSpellDetails(data) {
  const details = [];
  if (data.school?.name) details.push(`School: ${data.school.name}`);
  if (data.range) details.push(`Range: ${data.range}`);
  return details.join(' | ');
}

// Request one named spell or equipment record from the app's enrichment endpoint.
async function enrichResource(resource, name) {
  const key = `${resource}:${normalize(name)}`;
  if (enrichmentCache.has(key)) return enrichmentCache.get(key);
  const request = fetch(`/api/${resource}/${encodeURIComponent(name)}`, {
    headers: { Accept: 'application/json' }
  }).then(async response => {
    if (!response.ok) throw new Error(`API returned ${response.status}`);
    return response.json();
  });
  enrichmentCache.set(key, request);
  try {
    return await request;
  } catch (error) {
    enrichmentCache.delete(key);
    throw error;
  }
}

// Look up all current item and spell names and update their detail panels.
async function enrichSheet() {
  const output = enrichmentOutput('equipment');
  const equipmentDetails = [];
  for (const name of equipmentNames()) {
    try {
      const result = await enrichResource('equipment', name);
      const details = formatEquipmentDetails(result.data || {});
      if (details) equipmentDetails.push(`${result.name || name}: ${details}`);
    } catch (_) {
      // Unknown or empty equipment should not prevent other entries from loading.
    }
  }
  if (output) output.textContent = equipmentDetails.join('\n');

  const spellOutput = enrichmentOutput('spellcasting');
  const spellDetails = [];
  for (const name of spellNames()) {
    try {
      const result = await enrichResource('spells', name);
      const details = formatSpellDetails(result.data || {});
      if (details) spellDetails.push(`${result.name || name}: ${details}`);
    } catch (_) {
      // Unknown or empty spells should not prevent other entries from loading.
    }
  }
  if (spellOutput) spellOutput.textContent = spellDetails.join('\n');
}

// Parse equipment text into the character's armor, shield, and weapon properties.
function readEquipment() {
  const equipment = input('equipment')?.value || '';
  const values = { Armor: '', Shield: '', MainHand: '', OffHand: '' };
  const supplied = { MainHand: false, OffHand: false };
  for (const line of equipment.split('\n')) {
    const match = line.match(/^\s*(armor|shield|weapon|main\s*hand|off\s*-?\s*hand)\s*:\s*(.*?)\s*$/i);
    if (!match) continue;
    const label = match[1].toLowerCase().replace(/\s+/g, '');
    const field = label === 'armor' ? 'Armor'
      : label === 'shield' ? 'Shield'
      : label === 'off-hand' || label === 'offhand' ? 'OffHand'
      : 'MainHand';
    values[field] = match[2];
    if (field === 'MainHand' || field === 'OffHand') supplied[field] = true;
  }
  character.Armor = values.Armor;
  character.Shield = values.Shield;
  character.MainHand = supplied.MainHand ? values.MainHand : input('atkname1')?.value.trim() || '';
  character.OffHand = supplied.OffHand ? values.OffHand : input('atkname2')?.value.trim() || '';
  saveCharacter();
  recalculate();
}

// Parse spell text into the character's learned and prepared spell collections.
function readSpells() {
  const className = characterClass();
  const preparedCaster = ['cleric', 'druid', 'paladin', 'wizard'].includes(className);
  const learnedCaster = ['bard', 'sorcerer', 'warlock', 'ranger'].includes(className);
  const lines = input('spellcasting')?.value.split('\n') || [];
  const spells = { KnownSpells: [], PreparedSpells: [] };
  for (const line of lines) {
    const match = line.match(/^\s*(known|prepared)\s*spells?\s*:\s*(.*)$/i);
    if (!match) continue;
    const field = match[1].toLowerCase() === 'known' ? 'KnownSpells' : 'PreparedSpells';
    spells[field] = listValue(match[2]).map(spell => spell.toLowerCase());
  }
  if (spells.PreparedSpells.length && !preparedCaster || spells.KnownSpells.length && !learnedCaster) {
    renderSpells();
    return;
  }
  character.KnownSpells = spells.KnownSpells;
  character.PreparedSpells = spells.PreparedSpells;
  saveCharacter();
  recalculate();
}

// Calculate the character's proficiency bonus from level.
function proficiencyBonus(level) {
  return level < 1 ? 0 : 2 + Math.floor((level - 1) / 4);
}

// Calculate armor class from equipped defense, Dexterity, and class features.
function armorClass(scores) {
  const dexterity = modifier(scores.Dex);
  const armor = String(character.Armor || '').trim().toLowerCase();
  let armorClass = 10 + dexterity;
  const limitedDexterity = Math.min(dexterity, 2);
  switch (armor) {
    case 'leather armor': armorClass = 11 + dexterity; break;
    case 'studded leather armor': armorClass = 12 + dexterity; break;
    case 'hide armor': armorClass = 12 + limitedDexterity; break;
    case 'chain shirt': armorClass = 13 + limitedDexterity; break;
    case 'scale mail':
    case 'breastplate': armorClass = 14 + limitedDexterity; break;
    case 'half plate':
    case 'half plate armor': armorClass = 15 + limitedDexterity; break;
    case 'ring mail': armorClass = 14; break;
    case 'chain mail': armorClass = 16; break;
    case 'splint armor': armorClass = 17; break;
    case 'plate armor': armorClass = 18; break;
    case '':
      if (String(character.Class).toLowerCase() === 'barbarian') armorClass = 10 + dexterity + modifier(scores.Con);
      if (String(character.Class).toLowerCase() === 'monk') armorClass = 10 + dexterity + modifier(scores.Wis);
      break;
  }
  return armorClass + (character.Shield ? 2 : 0);
}

// Calculate the class's spellcasting ability and its derived attack values.
function spellcastingStats(level, proficiency, scores) {
  const abilities = {
    bard: ['Charisma', scores.Cha], cleric: ['Wisdom', scores.Wis], druid: ['Wisdom', scores.Wis],
    paladin: ['Charisma', scores.Cha], ranger: ['Wisdom', scores.Wis], sorcerer: ['Charisma', scores.Cha],
    warlock: ['Charisma', scores.Cha], wizard: ['Intelligence', scores.Int]
  };
  const result = abilities[String(character.Class).trim().toLowerCase()];
  if (!result) return '';
  const spellModifier = modifier(result[1]);
  return `Spellcasting: ${result[0]} | Save DC ${8 + proficiency + spellModifier} | Attack ${formatModifier(proficiency + spellModifier)}`;
}

// Summarize available spell slots at each level for the selected class.
function spellSlots(level) {
  const className = String(character.Class).trim().toLowerCase();
  if (level < 1 || ['paladin', 'ranger'].includes(className) && level < 2) return [];
  if (className === 'warlock') {
    const slotLevel = level >= 17 ? 5 : level >= 11 ? 5 : level >= 9 ? 5 : level >= 7 ? 4 : level >= 5 ? 3 : level >= 3 ? 2 : 1;
    const slots = level >= 17 ? 4 : level >= 2 ? 2 : 1;
    return [`Cantrips: ${characterCantripCount(level)}`, `Level ${slotLevel}: ${slots}`];
  }
  const casterLevel = ['paladin', 'ranger'].includes(className) ? Math.floor((level + 1) / 2) : level;
  const table = [[], [2], [3], [4], [4, 2], [4, 3], [4, 3, 2], [4, 3, 3, 1], [4, 3, 3, 2]];
  const slots = table[Math.min(casterLevel, 8)] || [];
  return [`Cantrips: ${characterCantripCount(level)}`].concat(slots.map((count, index) => `Level ${index + 1}: ${count}`));
}

function characterCantripCount(level) {
  const className = String(character.Class).trim().toLowerCase();
  if (['paladin', 'ranger'].includes(className)) return 0;
  if (className === 'warlock' || className === 'bard') return level >= 10 ? 4 : level >= 4 ? 3 : 2;
  return level >= 10 ? 5 : level >= 4 ? 4 : 3;
}

if (hasSavedCharacter) {
  for (const [name, value] of Object.entries(fields)) {
    setField(name, value);
  }
}

// Refresh all derived sheet values after a relevant input changes.
function recalculate() {
  const scores = {};
  for (const [label, property] of Object.entries(abilityFields)) {
    const score = Number(input(`${label}score`)?.value ?? character[property]);
    scores[property] = Number.isFinite(score) ? score : character[property];
    setField(`${label}mod`, formatModifier(modifier(scores[property])));
  }

  const levelText = input('classlevel')?.value ?? '';
  const levelMatch = levelText.match(/(\d+)\s*$/);
  const level = levelMatch ? Number(levelMatch[1]) : character.Level;
  const proficiency = 2 + Math.max(0, Math.floor((level - 1) / 4));
  setField('proficiencybonus', formatModifier(proficiency));
  setField('initiative', formatModifier(modifier(scores.Dex)));
  setField('passiveperception', 10 + modifier(scores.Wis));
  setField('ac', armorClass(scores));

  for (const [ability, property] of Object.entries(abilityFields)) {
    setField(`${ability}-save`, formatModifier(modifier(scores[property])));
  }
  for (const [skill, property] of Object.entries(skillAbilities)) {
    const proficient = (character.SkillProficiencies || []).some(value => value.toLowerCase() === skill.toLowerCase());
    setField(skill, formatModifier(modifier(scores[property]) + (proficient ? proficiency : 0)));
    const checkbox = input(`${skill}-prof`);
    if (checkbox) checkbox.checked = proficient;
  }
  setField('features', [
    listValue(character.KnownSpells).length ? `Known spells: ${listValue(character.KnownSpells).join(', ')}` : '',
    listValue(character.PreparedSpells).length ? `Prepared spells: ${listValue(character.PreparedSpells).join(', ')}` : '',
    spellcastingStats(level, proficiency, scores),
    `Spell slots: ${spellSlots(level).join(', ')}`
  ].filter(Boolean).join('\n'));
}

for (const label of Object.keys(abilityFields)) {
  input(`${label}score`)?.addEventListener('input', recalculate);
}
input('classlevel')?.addEventListener('input', recalculate);
input('equipment')?.addEventListener('change', readEquipment);
input('atkname1')?.addEventListener('change', readEquipment);
input('atkname2')?.addEventListener('change', readEquipment);
input('spellcasting')?.addEventListener('change', readSpells);
input('equipment')?.addEventListener('change', enrichSheet);
input('atkname1')?.addEventListener('change', enrichSheet);
input('atkname2')?.addEventListener('change', enrichSheet);
input('spellcasting')?.addEventListener('change', enrichSheet);
if (hasSavedCharacter) {
  renderEquipment();
  renderSpells();
  recalculate();
}
enrichSheet();

// Add a selector populated from the server's character collection endpoint.
async function showCharacterBrowser() {
  if (document.getElementById('character-browser')) return;
  const browser = document.createElement('select');
  browser.id = 'character-browser';
  browser.title = 'View a created character';
  browser.innerHTML = '<option value="">View created character...</option>';
  Object.assign(browser.style, {
    position: 'fixed', top: '0.5rem', right: '0.5rem', zIndex: '20',
    maxWidth: 'min(15rem, calc(100vw - 1rem))', padding: '0.35rem',
    background: '#fff', color: '#222', border: '1px solid #777'
  });
  browser.addEventListener('change', () => {
    if (browser.value) window.location.href = `/characters/${encodeURIComponent(browser.value)}`;
  });
  document.body.appendChild(browser);
  try {
    const response = await fetch('/api/characters', { headers: { Accept: 'application/json' } });
    if (!response.ok) throw new Error(`Character request failed: ${response.status}`);
    const characters = await response.json();
    for (const saved of characters) {
      const option = document.createElement('option');
      option.value = saved.Name;
      option.textContent = `${saved.Name} (${saved.Class || 'unknown'})`;
      if (serverCharacter?.Name === saved.Name) option.selected = true;
      browser.appendChild(option);
    }
  } catch (_) {
    browser.remove();
  }
}

showCharacterBrowser();

// Validate and persist the current character, reporting request errors beside the button.
document.getElementById('save-character')?.addEventListener('click', async () => {
  const status = document.getElementById('save-status');
  const name = input('charname')?.value.trim() || '';
  const classLevel = input('classlevel')?.value.trim().match(/^(.*?)\s+(\d+)$/);
  if (!name || !input('race')?.value.trim() || !classLevel) {
    if (status) status.textContent = 'Enter a character name, race, and class with level (for example, Wizard 1).';
    return;
  }
  character.Name = name;
  character.Race = input('race').value.trim();
  character.Class = classLevel[1].trim();
  character.Level = Number(classLevel[2]);
  character.Background = input('background')?.value.trim() || '';
  character.Str = Number(input('Strengthscore')?.value || 10);
  character.Dex = Number(input('Dexterityscore')?.value || 10);
  character.Con = Number(input('Constitutionscore')?.value || 10);
  character.Int = Number(input('Intelligencescore')?.value || 10);
  character.Wis = Number(input('Wisdomscore')?.value || 10);
  character.Cha = Number(input('Charismascore')?.value || 10);
  character.SkillProficiencies = Object.keys(skillAbilities)
    .filter(skill => input(skill + '-prof')?.checked)
    .map(skill => skill.toLowerCase());
  readEquipment();
  readSpells();
  if (status) status.textContent = 'Saving…';
  try {
    const response = await fetch('/api/characters', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(character)
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || ('Save failed (' + response.status + ')'));
    window.location.assign('/characters/' + encodeURIComponent(character.Name));
  } catch (error) {
    if (status) status.textContent = error.message || 'Could not save character.';
  }
});
</script>
